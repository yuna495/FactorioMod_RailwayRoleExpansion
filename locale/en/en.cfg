[mod-setting-description]
rre-weight-multiplicator=Higher weight reduces acceleration and increases braking distance.
rre-power-multiplicator=More power increases acceleration and fuel consumption. Top speed is not affected.
rre-old-sounds=Use pre-0.18 sounds for locomotive engines, wheel noise, and rail ties.
rre-hand-crafting=Allow train upgrades to be crafted by hand instead of requiring an assembling machine.
