[mod-setting-description]
rre-weight-multiplicator=重量が大きいほど加速が遅くなり、制動距離が長くなります。
rre-power-multiplicator=出力を上げると加速と燃料消費が増加します。最高速度には影響しません。
rre-old-sounds=0.18以前の機関車エンジン音、車輪音、レール継ぎ目音を使用します。
rre-hand-crafting=組立機を使わず、列車アップグレードを手作業でクラフトできるようにします。
